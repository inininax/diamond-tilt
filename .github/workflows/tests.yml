name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editmode-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run EditMode suite
        run: sh Scripts/run-tests.sh
